# Cap-go org policy: GitHub Actions use latest major version tags (e.g. @v7), not commit SHA pins.
# Sonar rule githubactions:S7637 flags mutable refs; we accept that tradeoff per org policy.
sonar.issue.ignore.multicriteria=gha1
sonar.issue.ignore.multicriteria.gha1.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.gha1.resourceKey=.github/workflows/**

name: Build source code and test it

on:
  push:
    branches:
      - renovate/**
  pull_request:
    branches: [main]
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches: [main]
  workflow_call: # Allow this workflow to be called by other workflows

jobs:
  guard_swiftpm_version:
    if: >-
      github.event_name == 'workflow_call' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.x
      - name: Check out
        uses: actions/checkout@v6.1.0
        with:
          repository: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' }}
          persist-credentials: false
      - name: Enforce capacitor-swift-pm version
        run: |
          set -euo pipefail
          if ! grep -Eq 'https://github.com/ionic-team/capacitor-swift-pm\.git"[[:space:]]*,[[:space:]]*from:[[:space:]]*"8\.0\.0"' Package.swift; then
            echo "Expected capacitor-swift-pm to be pinned to 8.0.0 in Package.swift"
            exit 1
          fi
  build_android:
    if: >-
      github.event_name == 'workflow_call' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v6.1.0
        with:
          repository: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.x
      - name: Install dependencies
        id: install_code
        run: bun i
      - name: Check plugin wiring
        run: bun run check:wiring
      - name: Setup java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Build
        id: build_code
        run: bun run verify:android
      - name: Verify packed package in example app (Android)
        shell: bash
        run: bash ./.github/scripts/verify-packed-example.sh android
  build_ios:
    if: >-
      github.event_name == 'workflow_call' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: macOS-latest
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v6.1.0
        with:
          repository: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.x
      - name: Install dependencies
        id: install_code
        run: bun i
      - name: Check plugin wiring
        run: bun run check:wiring
      - name: Build
        id: build_code
        run: bun run verify:ios
      - name: Verify packed package in example app (iOS)
        shell: bash
        run: bash ./.github/scripts/verify-packed-example.sh ios
  web:
    if: >-
      github.event_name == 'workflow_call' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    name: 'Build code and test'
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.x
      - name: Check out
        uses: actions/checkout@v6.1.0
        with:
          repository: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
      - name: Install dependencies
        id: install_code
        run: bun i
      - name: Check plugin wiring
        run: bun run check:wiring
      - name: Lint
        id: lint_code
        run: bun run lint
      - name: Verify packed package in example app (Web)
        shell: bash
        run: bash ./.github/scripts/verify-packed-example.sh web
      - name: Verify
        id: verify_code
        run: bun run verify:web
